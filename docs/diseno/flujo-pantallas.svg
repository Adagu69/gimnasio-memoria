<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5d6782"/></marker></defs>
  <rect width="1200" height="560" fill="#ffffff"/>
  <text x="40" y="48" font-size="26" font-weight="700" fill="#17203a">Flujo de pantallas (v3.0): programa de entrenamiento en el Gimnasio 3D</text>
  <text x="40" y="74" font-size="14" fill="#5d6782">Flujo de entrada una sola vez (arriba) y uso diario (abajo). Toda la navegación ocurre dentro de una página.</text>

  <text x="40" y="112" font-size="12" font-weight="700" fill="#5d6782">PRIMERA VEZ</text>
  <g font-size="13" font-weight="700" fill="#17203a" text-anchor="middle">
    <rect x="40" y="122" width="150" height="64" rx="12" fill="#e2e9ff" stroke="#2a56e8" stroke-width="1.5"/><text x="115" y="150">Bienvenida</text><text x="115" y="168" font-size="11" font-weight="400" fill="#5d6782">Empecemos</text>
    <rect x="230" y="122" width="170" height="64" rx="12" fill="#ffffff" stroke="#d6dceb"/><text x="315" y="150">Configuración</text><text x="315" y="168" font-size="11" font-weight="400" fill="#5d6782">6 pasos · barra de progreso</text>
    <rect x="440" y="122" width="230" height="64" rx="12" fill="#ffffff" stroke="#d6dceb"/><text x="555" y="150">Prueba de nivel</text><text x="555" y="168" font-size="11" font-weight="400" fill="#5d6782">Pares → Secuencia → N-Back → Palacio</text>
    <rect x="710" y="122" width="170" height="64" rx="12" fill="#ffffff" stroke="#d6dceb"/><text x="795" y="150">Resultados</text><text x="795" y="168" font-size="11" font-weight="400" fill="#5d6782">índice inicial (línea base)</text>
    <rect x="920" y="122" width="150" height="64" rx="12" fill="#ffffff" stroke="#d6dceb"/><text x="995" y="150">Plan 30 días</text><text x="995" y="168" font-size="11" font-weight="400" fill="#5d6782">meta +25 % / +35 %</text>
  </g>
  <g stroke="#5d6782" stroke-width="1.5" fill="none" marker-end="url(#f)">
    <path d="M190 154 H230"/><path d="M400 154 H440"/><path d="M670 154 H710"/><path d="M880 154 H920"/>
    <path d="M995 186 C 995 230, 160 230, 160 262"/>
  </g>

  <!-- Bucle por juego dentro de la prueba de nivel / sesión diaria -->
  <rect x="440" y="196" width="230" height="52" rx="10" fill="#fdf0d8" stroke="#c97d12"/>
  <text x="555" y="217" font-size="12" font-weight="700" fill="#17203a" text-anchor="middle">Por cada juego:</text>
  <text x="555" y="236" font-size="11" fill="#5d6782" text-anchor="middle">intro → OBSERVA → TU TURNO → RESULTADO (física)</text>
  <path d="M555 186 V196" stroke="#c97d12" stroke-width="1.5" fill="none" marker-end="url(#f)"/>

  <text x="40" y="280" font-size="12" font-weight="700" fill="#5d6782">USO DIARIO (Gimnasio 3D con estaciones · lista de juegos · Mi progreso · Ajustes)</text>
  <g font-size="13" font-weight="700" fill="#17203a" text-anchor="middle">
    <rect x="40" y="292" width="240" height="90" rx="12" fill="#dff5e8" stroke="#1a9a57" stroke-width="1.5"/><text x="160" y="320">Gimnasio 3D</text><text x="160" y="340" font-size="11" font-weight="400" fill="#5d6782">5 estaciones · camino del día</text><text x="160" y="356" font-size="11" font-weight="400" fill="#5d6782">Torre de constancia · índice por área</text>
    <rect x="330" y="292" width="200" height="90" rx="12" fill="#ffffff" stroke="#d6dceb"/><text x="430" y="320">Sesión diaria</text><text x="430" y="340" font-size="11" font-weight="400" fill="#5d6782">mismo bucle intro → juego → resultado</text><text x="430" y="356" font-size="11" font-weight="400" fill="#5d6782">resumen: puntaje del día + racha</text>
    <rect x="580" y="292" width="180" height="90" rx="12" fill="#ffffff" stroke="#d6dceb"/><text x="670" y="320">Juegos</text><text x="670" y="340" font-size="11" font-weight="400" fill="#5d6782">práctica libre</text><text x="670" y="356" font-size="11" font-weight="400" fill="#5d6782">ayuda con base teórica</text>
    <rect x="810" y="292" width="180" height="90" rx="12" fill="#ffffff" stroke="#d6dceb"/><text x="900" y="320">Mi progreso</text><text x="900" y="340" font-size="11" font-weight="400" fill="#5d6782">índice vs. línea base</text><text x="900" y="356" font-size="11" font-weight="400" fill="#5d6782">logros · historial</text>
    <rect x="1040" y="292" width="120" height="90" rx="12" fill="#ffffff" stroke="#d6dceb"/><text x="1100" y="320">Ajustes</text><text x="1100" y="340" font-size="11" font-weight="400" fill="#5d6782">repetir prueba</text><text x="1100" y="356" font-size="11" font-weight="400" fill="#5d6782">reconfigurar</text>
  </g>
  <g stroke="#5d6782" stroke-width="1.5" fill="none" marker-end="url(#f)">
    <path d="M280 337 H330"/><path d="M430 382 C 430 420, 160 420, 160 384" stroke-dasharray="6 4"/>
    <path d="M1100 382 C 1100 440, 555 440, 555 250" stroke-dasharray="6 4"/>
  </g>
  <text x="200" y="412" font-size="11" fill="#5d6782">guarda sesión diaria → actualiza calendario, racha e índice</text>
  <text x="700" y="446" font-size="11" fill="#5d6782">"Repetir prueba de nivel" vuelve a la calibración</text>

  <rect x="40" y="476" width="1120" height="60" rx="8" fill="#eef1f7" stroke="#d6dceb"/>
  <text x="56" y="500" font-size="12" fill="#17203a"><tspan font-weight="700" fill="#2a56e8">PDCA en el bucle de juego: </tspan>Planificar = nivel propuesto por el historial · Hacer = jugar · Verificar = métrica normalizada 0–100 · Actuar = regla de adaptación.</text>
  <text x="56" y="522" font-size="12" fill="#17203a"><tspan font-weight="700" fill="#2a56e8">PDCA en el programa: </tspan>Planificar = prueba de nivel y meta · Hacer = sesiones diarias · Verificar = índice vs. línea base · Actuar = repetir prueba / reconfigurar.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>

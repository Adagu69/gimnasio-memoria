<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5d6782"/></marker>
  </defs>
  <rect width="1200" height="520" fill="#ffffff"/>
  <text x="40" y="48" font-size="26" font-weight="700" fill="#17203a">Flujo de pantallas y bucle de juego</text>
  <text x="40" y="74" font-size="14" fill="#5d6782">Toda la navegación ocurre dentro de una página; cada vista se muestra u oculta sin recargar.</text>

  <g font-size="14" font-weight="700" fill="#17203a" text-anchor="middle">
    <!-- Inicio -->
    <rect x="40" y="200" width="180" height="90" rx="12" fill="#e2e9ff" stroke="#2a56e8" stroke-width="1.5"/>
    <text x="130" y="238">Inicio</text><text x="130" y="258" font-size="12" font-weight="400" fill="#5d6782">elegir juego</text>

    <!-- Juegos -->
    <rect x="300" y="110" width="200" height="70" rx="12" fill="#ffffff" stroke="#d6dceb"/><text x="400" y="140">Pares</text><text x="400" y="160" font-size="12" font-weight="400" fill="#5d6782">nivel 1 → 6</text>
    <rect x="300" y="210" width="200" height="70" rx="12" fill="#ffffff" stroke="#d6dceb"/><text x="400" y="240">Secuencia</text><text x="400" y="260" font-size="12" font-weight="400" fill="#5d6782">3 bloques → …</text>
    <rect x="300" y="310" width="200" height="70" rx="12" fill="#ffffff" stroke="#d6dceb"/><text x="400" y="340">N-Back</text><text x="400" y="360" font-size="12" font-weight="400" fill="#5d6782">20 turnos, N = 1..3</text>

    <!-- Bucle -->
    <rect x="580" y="140" width="200" height="70" rx="12" fill="#ffffff" stroke="#d6dceb"/><text x="680" y="170">Jugar ronda</text><text x="680" y="190" font-size="12" font-weight="400" fill="#5d6782">estímulo → respuesta</text>
    <rect x="580" y="280" width="200" height="70" rx="12" fill="#ffffff" stroke="#d6dceb"/><text x="680" y="310">Resultado</text><text x="680" y="330" font-size="12" font-weight="400" fill="#5d6782">métrica + mensaje</text>

    <!-- Decisión -->
    <path d="M960 150 L1050 210 L960 270 L870 210 Z" fill="#fdf0d8" stroke="#c97d12" stroke-width="1.5"/>
    <text x="960" y="206">¿Superado?</text><text x="960" y="224" font-size="12" font-weight="400" fill="#5d6782">adaptación</text>

    <!-- Progreso -->
    <rect x="860" y="380" width="200" height="90" rx="12" fill="#dff5e8" stroke="#1a9a57" stroke-width="1.5"/>
    <text x="960" y="418">Progreso</text><text x="960" y="438" font-size="12" font-weight="400" fill="#5d6782">historial · mejores marcas</text>
  </g>

  <g stroke="#5d6782" stroke-width="1.5" fill="none" marker-end="url(#f)">
    <path d="M220 245 C260 245 260 145 300 145"/>
    <path d="M220 245 H300"/>
    <path d="M220 245 C260 245 260 345 300 345"/>
    <path d="M500 145 C540 145 540 175 580 175"/>
    <path d="M500 245 C540 245 540 175 580 175"/>
    <path d="M500 345 C540 345 540 175 580 175"/>
    <path d="M680 210 V280"/>
    <path d="M780 315 C830 315 830 210 870 210"/>
    <path d="M960 270 V380"/>
    <path d="M1050 210 C1120 210 1120 60 680 60 C640 60 640 140 680 140" stroke-dasharray="6 4"/>
    <path d="M870 210 C820 210 820 110 680 110 C660 110 660 140 680 140" stroke-dasharray="6 4"/>
    <path d="M860 425 C600 425 400 425 130 425 C100 425 100 290 130 290"/>
  </g>
  <g font-size="12" fill="#5d6782">
    <text x="690" y="250">guarda sesión en localStorage</text>
    <text x="1060" y="130">Sí → sube dificultad (+1 nivel, +1 bloque, N+1)</text>
    <text x="700" y="100">No → repite o baja dificultad</text>
    <text x="450" y="445">volver al inicio / elegir otro juego</text>
  </g>

  <!-- Leyenda PDCA -->
  <rect x="40" y="470" width="760" height="36" rx="8" fill="#eef1f7" stroke="#d6dceb"/>
  <text x="56" y="493" font-size="12" fill="#17203a"><tspan font-weight="700" fill="#2a56e8">PDCA en el bucle: </tspan>Planificar = nivel propuesto · Hacer = jugar ronda · Verificar = métrica de la sesión · Actuar = regla de adaptación.</text>
</svg>

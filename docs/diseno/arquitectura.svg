<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5d6782"/></marker></defs>
  <rect width="1200" height="800" fill="#ffffff"/>
  <text x="40" y="48" font-size="26" font-weight="700" fill="#17203a">Gimnasio de Memoria — Arquitectura del sistema (v3.0 Pixel-3D)</text>
  <text x="40" y="74" font-size="14" fill="#5d6782">Aplicación web estática de una sola página, módulos ES en JavaScript; Three.js y Matter.js empaquetadas con esbuild. "El DOM es la verdad, el 3D es la piel".</text>

  <!-- Capa 1: Presentación -->
  <rect x="40" y="100" width="1120" height="200" rx="12" fill="#eef1f7" stroke="#d6dceb"/>
  <text x="60" y="128" font-size="12" font-weight="700" fill="#2a56e8" letter-spacing="1.5">CAPA DE PRESENTACIÓN · HTML5 + CSS (tokens, tema claro/oscuro, resortes linear(), materiales)</text>
  <text x="60" y="152" font-size="12" font-weight="700" fill="#5d6782">FLUJO DE ENTRADA (pantalla completa)</text>
  <g font-size="13" font-weight="700" fill="#17203a" text-anchor="middle">
    <rect x="60" y="160" width="200" height="54" rx="8" fill="#ffffff" stroke="#d6dceb"/><text x="160" y="183">Bienvenida</text><text x="160" y="202" font-size="11" font-weight="400" fill="#5d6782">3 pasos del programa</text>
    <rect x="270" y="160" width="200" height="54" rx="8" fill="#ffffff" stroke="#d6dceb"/><text x="370" y="183">Configuración</text><text x="370" y="202" font-size="11" font-weight="400" fill="#5d6782">nombre · objetivo · áreas · edad · dificultad</text>
    <rect x="480" y="160" width="200" height="54" rx="8" fill="#ffffff" stroke="#d6dceb"/><text x="580" y="183">Prueba de nivel</text><text x="580" y="202" font-size="11" font-weight="400" fill="#5d6782">intro → juego → resultado ×4</text>
    <rect x="690" y="160" width="200" height="54" rx="8" fill="#ffffff" stroke="#d6dceb"/><text x="790" y="183">Resultados</text><text x="790" y="202" font-size="11" font-weight="400" fill="#5d6782">índice por área + global</text>
    <rect x="900" y="160" width="240" height="54" rx="8" fill="#ffffff" stroke="#d6dceb"/><text x="1020" y="183">Plan de 30 días</text><text x="1020" y="202" font-size="11" font-weight="400" fill="#5d6782">línea base → meta</text>
  </g>
  <text x="60" y="238" font-size="12" font-weight="700" fill="#5d6782">APLICACIÓN (menú lateral · barra inferior en móvil)</text>
  <g font-size="13" font-weight="700" fill="#17203a" text-anchor="middle">
    <rect x="60" y="246" width="200" height="44" rx="8" fill="#ffffff" stroke="#2a56e8" stroke-width="1.5"/><text x="160" y="266">Gimnasio 3D (Hoy)</text><text x="160" y="282" font-size="11" font-weight="400" fill="#5d6782">5 estaciones · camino del día · Torre</text>
    <rect x="270" y="246" width="200" height="44" rx="8" fill="#ffffff" stroke="#d6dceb"/><text x="370" y="266">Juegos</text><text x="370" y="282" font-size="11" font-weight="400" fill="#5d6782">Pares · Secuencia · N-Back · Palacio</text>
    <rect x="480" y="246" width="200" height="44" rx="8" fill="#ffffff" stroke="#d6dceb"/><text x="580" y="266">Mi progreso</text><text x="580" y="282" font-size="11" font-weight="400" fill="#5d6782">índice vs. base · logros · historial</text>
    <rect x="690" y="246" width="200" height="44" rx="8" fill="#ffffff" stroke="#d6dceb"/><text x="790" y="266">Ajustes</text><text x="790" y="282" font-size="11" font-weight="400" fill="#5d6782">nombre · sonido · tema · repetir prueba</text>
    <rect x="900" y="246" width="240" height="44" rx="8" fill="#ffffff" stroke="#d6dceb"/><text x="1020" y="266">Planes · Ayuda (modal)</text><text x="1020" y="282" font-size="11" font-weight="400" fill="#5d6782">modelo freemium · base teórica</text>
  </g>

  <!-- Capa 2: Lógica -->
  <rect x="40" y="330" width="1120" height="220" rx="12" fill="#eef1f7" stroke="#d6dceb"/>
  <text x="60" y="358" font-size="12" font-weight="700" fill="#2a56e8" letter-spacing="1.5">CAPA DE LÓGICA · JavaScript (módulos ES)</text>
  <rect x="60" y="372" width="1080" height="40" rx="8" fill="#ffffff" stroke="#d6dceb"/>
  <text x="80" y="397" font-size="14" font-weight="700" fill="#17203a">router.js</text>
  <text x="170" y="397" font-size="13" fill="#5d6782">go(vista) · hooks enter/leave · oculta el menú en el flujo de entrada · animación de entrada interrumpible</text>
  <g font-size="13" font-weight="700" fill="#17203a" text-anchor="middle">
    <rect x="60" y="426" width="200" height="108" rx="8" fill="#ffffff" stroke="#c97d12" stroke-width="1.5"/><text x="160" y="449">config.js</text>
      <text x="160" y="468" font-size="11" font-weight="400" fill="#5d6782">asistente de 6 pasos</text><text x="160" y="484" font-size="11" font-weight="400" fill="#5d6782">guarda perfil y dificultad</text><text x="160" y="500" font-size="11" font-weight="400" fill="#5d6782">lanza la prueba de nivel</text>
    <rect x="270" y="426" width="230" height="108" rx="8" fill="#ffffff" stroke="#c97d12" stroke-width="1.5"/><text x="385" y="449">sesion.js</text>
      <text x="385" y="468" font-size="11" font-weight="400" fill="#5d6782">modos: calibración · diaria</text><text x="385" y="484" font-size="11" font-weight="400" fill="#5d6782">encadena juegos: intro → start(onEnd) → resultado</text><text x="385" y="500" font-size="11" font-weight="400" fill="#5d6782">resultados, plan, resumen del día</text>
    <rect x="510" y="426" width="330" height="108" rx="8" fill="#ffffff" stroke="#2a56e8" stroke-width="1.5"/><text x="675" y="449">games/ pares · secuencia · nback · palacio</text>
      <text x="675" y="468" font-size="11" font-weight="400" fill="#5d6782">interfaz común: init() · start({onEnd}) · stop()</text><text x="675" y="484" font-size="11" font-weight="400" fill="#5d6782">adaptación: +1 nivel · +1 bloque · regla 85 % / 60 % (N y lugares)</text><text x="675" y="500" font-size="11" font-weight="400" fill="#5d6782">métricas: eficiencia · amplitud · precisión · lugares</text>
    <rect x="850" y="426" width="290" height="108" rx="8" fill="#ffffff" stroke="#1a9a57" stroke-width="1.5"/><text x="995" y="449">indice.js · hoy.js · progreso.js</text>
      <text x="995" y="468" font-size="11" font-weight="400" fill="#5d6782">normalize(sesión) → 0–100</text><text x="995" y="484" font-size="11" font-weight="400" fill="#5d6782">índice de área = media de últimas 3 · global = media de áreas</text><text x="995" y="500" font-size="11" font-weight="400" fill="#5d6782">meta +25 % / +35 % · racha · calendario · logros</text>
  </g>

  <!-- Capa 3: Servicios y publicación -->
  <rect x="40" y="580" width="700" height="110" rx="12" fill="#eef1f7" stroke="#d6dceb"/>
  <text x="60" y="608" font-size="12" font-weight="700" fill="#2a56e8" letter-spacing="1.5">PIEL 3D Y SERVICIOS DEL NAVEGADOR</text>
  <g font-size="14" font-weight="700" fill="#17203a" text-anchor="middle">
    <rect x="60" y="622" width="320" height="50" rx="8" fill="#ffffff" stroke="#d6dceb"/><text x="220" y="644">three/ · physics/ (piel Pixel-3D)</text><text x="220" y="662" font-size="12" font-weight="400" fill="#5d6782">engine · skin · anchor DOM↔3D · scenes/ · Matter.js decorativo</text>
    <rect x="400" y="622" width="320" height="50" rx="8" fill="#ffffff" stroke="#d6dceb"/><text x="560" y="644">store · audio · ui</text><text x="560" y="662" font-size="12" font-weight="400" fill="#5d6782">localStorage · Web Audio · Vibration API · modal · toast</text>
  </g>
  <rect x="760" y="580" width="400" height="110" rx="12" fill="#eef1f7" stroke="#d6dceb"/>
  <text x="780" y="608" font-size="12" font-weight="700" fill="#2a56e8" letter-spacing="1.5">CALIDAD Y PUBLICACIÓN</text>
  <rect x="780" y="622" width="360" height="50" rx="8" fill="#ffffff" stroke="#d6dceb"/>
  <text x="960" y="644" font-size="14" font-weight="700" fill="#17203a" text-anchor="middle">tools/ test · build · capturas · video · informe</text>
  <text x="960" y="662" font-size="12" fill="#5d6782" text-anchor="middle">node --test (33) · Playwright E2E ×2 pieles · esbuild → dist/ · Vercel</text>

  <g stroke="#5d6782" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M600 300 V330"/><path d="M400 550 V580"/><path d="M960 550 V580"/>
  </g>
  <text x="612" y="320" font-size="11" font-weight="400" fill="#5d6782">eventos (pointer-down, teclado) · render del DOM</text>
  <text x="412" y="570" font-size="11" font-weight="400" fill="#5d6782">store.addSession / addRoutine · tone()</text>
  <text x="972" y="570" font-size="11" font-weight="400" fill="#5d6782">npm test → build → deploy</text>

  <rect x="40" y="712" width="1120" height="70" rx="12" fill="#ffffff" stroke="#d6dceb"/>
  <text x="60" y="738" font-size="12" font-weight="700" fill="#2a56e8" letter-spacing="1.5">MODELO DE DATOS</text>
  <text x="60" y="760" font-size="12" fill="#17203a" font-family="Consolas, Menlo, monospace">profile {name, goal, areas[4], ageRange, difficulty, calibration}   settings {visual: pixel3d|clasico, …}   sessions[{game, métricas, t}]   routines[{score, parts, day}]</text>
  <text x="60" y="776" font-size="11" font-weight="400" fill="#5d6782">Todo se guarda en el navegador del usuario; no se envía nada a ningún servidor.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>

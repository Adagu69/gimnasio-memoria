<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5d6782"/></marker>
  </defs>
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="40" y="48" font-size="26" font-weight="700" fill="#17203a">Gimnasio de Memoria — Arquitectura del sistema (Avance 1)</text>
  <text x="40" y="74" font-size="14" fill="#5d6782">Aplicación web estática. Una sola página, módulos en JavaScript, sin backend.</text>

  <!-- Capa 1: Presentación -->
  <rect x="40" y="100" width="1120" height="170" rx="12" fill="#eef1f7" stroke="#d6dceb"/>
  <text x="60" y="128" font-size="12" font-weight="700" fill="#2a56e8" letter-spacing="1.5">CAPA DE PRESENTACIÓN · HTML5 + CSS</text>
  <rect x="60" y="142" width="1080" height="40" rx="8" fill="#ffffff" stroke="#d6dceb"/>
  <text x="80" y="167" font-size="14" font-weight="700" fill="#17203a">Barra superior</text>
  <text x="200" y="167" font-size="13" fill="#5d6782">Logo · Versión · Pestañas: Inicio / Pares / Secuencia / N-Back / Progreso</text>
  <g font-size="14" font-weight="700" fill="#17203a" text-anchor="middle">
    <rect x="60" y="196" width="200" height="56" rx="8" fill="#ffffff" stroke="#d6dceb"/><text x="160" y="220">Vista Inicio</text><text x="160" y="240" font-size="12" font-weight="400" fill="#5d6782">tarjetas de juego + stats</text>
    <rect x="280" y="196" width="200" height="56" rx="8" fill="#ffffff" stroke="#d6dceb"/><text x="380" y="220">Vista Pares</text><text x="380" y="240" font-size="12" font-weight="400" fill="#5d6782">tablero de cartas</text>
    <rect x="500" y="196" width="200" height="56" rx="8" fill="#ffffff" stroke="#d6dceb"/><text x="600" y="220">Vista Secuencia</text><text x="600" y="240" font-size="12" font-weight="400" fill="#5d6782">cuadrícula 3×3 Corsi</text>
    <rect x="720" y="196" width="200" height="56" rx="8" fill="#ffffff" stroke="#d6dceb"/><text x="820" y="220">Vista N-Back</text><text x="820" y="240" font-size="12" font-weight="400" fill="#5d6782">estímulo + botón Coincide</text>
    <rect x="940" y="196" width="200" height="56" rx="8" fill="#ffffff" stroke="#d6dceb"/><text x="1040" y="220">Vista Progreso</text><text x="1040" y="240" font-size="12" font-weight="400" fill="#5d6782">KPIs, barras, historial</text>
  </g>

  <!-- Capa 2: Lógica -->
  <rect x="40" y="300" width="1120" height="190" rx="12" fill="#eef1f7" stroke="#d6dceb"/>
  <text x="60" y="328" font-size="12" font-weight="700" fill="#2a56e8" letter-spacing="1.5">CAPA DE LÓGICA · JavaScript (módulos)</text>
  <rect x="60" y="342" width="1080" height="40" rx="8" fill="#ffffff" stroke="#d6dceb"/>
  <text x="80" y="367" font-size="14" font-weight="700" fill="#17203a">Router de vistas</text>
  <text x="210" y="367" font-size="13" fill="#5d6782">go(vista) · muestra una sección, detiene los juegos activos, actualiza la pestaña</text>
  <g font-size="14" font-weight="700" fill="#17203a" text-anchor="middle">
    <rect x="60" y="396" width="250" height="78" rx="8" fill="#ffffff" stroke="#2a56e8" stroke-width="1.5"/><text x="185" y="420">Módulo Pares</text>
      <text x="185" y="440" font-size="12" font-weight="400" fill="#5d6782">6 niveles · baraja · volteo · cronómetro</text><text x="185" y="458" font-size="12" font-weight="400" fill="#5d6782">métrica: intentos, tiempo, eficiencia</text>
    <rect x="330" y="396" width="250" height="78" rx="8" fill="#ffffff" stroke="#2a56e8" stroke-width="1.5"/><text x="455" y="420">Módulo Secuencia</text>
      <text x="455" y="440" font-size="12" font-weight="400" fill="#5d6782">genera secuencia · reproduce · valida</text><text x="455" y="458" font-size="12" font-weight="400" fill="#5d6782">métrica: amplitud (span)</text>
    <rect x="600" y="396" width="250" height="78" rx="8" fill="#ffffff" stroke="#2a56e8" stroke-width="1.5"/><text x="725" y="420">Módulo N-Back</text>
      <text x="725" y="440" font-size="12" font-weight="400" fill="#5d6782">20 turnos · ISI 2,5 s · N = 1..3</text><text x="725" y="458" font-size="12" font-weight="400" fill="#5d6782">métrica: aciertos, omisiones, falsas alarmas</text>
    <rect x="870" y="396" width="270" height="78" rx="8" fill="#ffffff" stroke="#c97d12" stroke-width="1.5"/><text x="1005" y="420">Dificultad adaptativa</text>
      <text x="1005" y="440" font-size="12" font-weight="400" fill="#5d6782">Pares: +1 nivel al completar</text><text x="1005" y="458" font-size="12" font-weight="400" fill="#5d6782">Corsi: +1 bloque · N-Back: regla 85 % / 60 %</text>
  </g>

  <!-- Capa 3: Servicios -->
  <rect x="40" y="520" width="700" height="110" rx="12" fill="#eef1f7" stroke="#d6dceb"/>
  <text x="60" y="548" font-size="12" font-weight="700" fill="#2a56e8" letter-spacing="1.5">SERVICIOS DEL NAVEGADOR</text>
  <g font-size="14" font-weight="700" fill="#17203a" text-anchor="middle">
    <rect x="60" y="562" width="320" height="50" rx="8" fill="#ffffff" stroke="#d6dceb"/><text x="220" y="584">Store · localStorage</text><text x="220" y="602" font-size="12" font-weight="400" fill="#5d6782">clave gimnasio-memoria.v1 · lista de sesiones JSON</text>
    <rect x="400" y="562" width="320" height="50" rx="8" fill="#ffffff" stroke="#d6dceb"/><text x="560" y="584">Audio · Web Audio API</text><text x="560" y="602" font-size="12" font-weight="400" fill="#5d6782">tonos por bloque · acierto · error (sin archivos)</text>
  </g>

  <!-- Publicación -->
  <rect x="760" y="520" width="400" height="110" rx="12" fill="#eef1f7" stroke="#d6dceb"/>
  <text x="780" y="548" font-size="12" font-weight="700" fill="#2a56e8" letter-spacing="1.5">PUBLICACIÓN</text>
  <rect x="780" y="562" width="360" height="50" rx="8" fill="#ffffff" stroke="#d6dceb"/>
  <text x="960" y="584" font-size="14" font-weight="700" fill="#17203a" text-anchor="middle">Servidor estático</text>
  <text x="960" y="602" font-size="12" fill="#5d6782" text-anchor="middle">index.html → Vercel / GitHub Pages · repositorio Git = archivos editables</text>

  <!-- Flechas -->
  <g stroke="#5d6782" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M600 270 V300"/>
    <path d="M400 490 V520"/>
    <path d="M960 490 V520"/>
  </g>
  <text x="612" y="290" font-size="11" fill="#5d6782">eventos click / teclado · render del DOM</text>
  <text x="412" y="510" font-size="11" fill="#5d6782">store.add(sesión) · tone(freq)</text>
  <text x="972" y="510" font-size="11" fill="#5d6782">build → deploy</text>

  <!-- Modelo de datos -->
  <rect x="40" y="660" width="1120" height="80" rx="12" fill="#ffffff" stroke="#d6dceb"/>
  <text x="60" y="686" font-size="12" font-weight="700" fill="#2a56e8" letter-spacing="1.5">MODELO DE DATOS (una sesión)</text>
  <text x="60" y="710" font-size="13" fill="#17203a" font-family="Consolas, Menlo, monospace">pares  {game, level, moves, secs, eff, t}     corsi  {game, span, failedAt, t}     nback  {game, n, acc, hits, miss, fa, t}</text>
  <text x="60" y="730" font-size="12" fill="#5d6782">t = marca de tiempo. El panel de Progreso agrega estas sesiones por juego (sesiones, mejor marca, media, últimas 10).</text>
</svg>
